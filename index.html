<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/onepiece.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b18" />
    <meta
      name="description"
      content="Personal profile — a developer sailing the Grand Line of code."
    />
    <title>DavServ — Personal Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Pirata+One&display=swap"
    />

    <script>
      // Apply the stored theme before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (!t)
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          if (t === 'dark') document.documentElement.classList.add('dark')
          var l = localStorage.getItem('lang')
          if (l) document.documentElement.lang = l
        } catch (e) {}
        document.documentElement.classList.add('js')
      })()
    </script>

    <style>
      /* Preloader is inlined so it renders on the first frame, before any JS bundle. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 26px;
        background: #f5e7cd;
        color: #2a1a0f;
        font-family: ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      html.dark #boot {
        background: #050b18;
        color: #eaf1fb;
      }
      #boot[data-done='1'] {
        opacity: 0;
        visibility: hidden;
      }
      #boot .wheel {
        width: 108px;
        height: 108px;
        animation: boot-spin 3.2s linear infinite;
      }
      #boot .cap {
        font-family: 'Pirata One', ui-serif, Georgia, serif;
        font-size: 30px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #boot .sub {
        margin-top: -14px;
        font-size: 12px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        opacity: 0.65;
      }
      #boot .bar {
        width: min(230px, 62vw);
        height: 4px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(42, 26, 15, 0.16);
      }
      html.dark #boot .bar {
        background: rgba(234, 241, 251, 0.16);
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 99px;
        background: linear-gradient(90deg, #b3121f, #b8830c);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      html.dark #boot .bar i {
        background: linear-gradient(90deg, #ef4b57, #f5b93c);
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-105%);
        }
        100% {
          transform: translateX(255%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .wheel,
        #boot .bar i {
          animation: none;
        }
        #boot .bar i {
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="is-loading">
    <div id="boot" role="status" aria-live="polite" aria-label="Loading">
      <svg class="wheel" viewBox="0 0 100 100" aria-hidden="true">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="3.4"
          stroke-linecap="round"
        >
          <circle cx="50" cy="50" r="30" />
          <circle cx="50" cy="50" r="12" />
          <circle cx="50" cy="50" r="4.5" fill="currentColor" stroke="none" />
          <path d="M50 8v12M50 80v12M8 50h12M80 50h12" />
          <path d="M20.5 20.5l8.5 8.5M71 71l8.5 8.5M79.5 20.5L71 29M29 71l-8.5 8.5" />
        </g>
      </svg>
      <div class="cap">Setting Sail</div>
      <div class="sub">Grand Line</div>
      <div class="bar"><i></i></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
